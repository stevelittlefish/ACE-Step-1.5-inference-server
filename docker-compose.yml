# =============================================================================
# ACE-Step 1.5 — Personal Web UI + REST API deployment (NVIDIA CUDA)
# =============================================================================
#
# Usage:
#   sudo mkdir -p /srv/acestep/{checkpoints,cache,huggingface,outputs,training}
#   sudo mkdir -p /srv/acestep/gradio_outputs
#   docker compose up --build -d
#   docker compose logs -f acestep
#   curl http://localhost:8020/health
#   Open http://localhost:8020/docs for the OpenAPI schema
#
# API mode only. There is no Web UI, which is deliberate.
#
# Persistent data is intentionally kept outside the repository under
# /srv/acestep. Override ACESTEP_DATA_ROOT if a different host path is needed.
#
# =============================================================================

services:
  acestep:
    build:
      context: .
      dockerfile: Dockerfile
    image: acestep-local:1.5
    container_name: acestep

    # ---- GPU access ----
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]

    # ---- Environment ----
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"

      # api, not gradio. These are two different entry points — see
      # docker-entrypoint.sh: `api` runs acestep.api_server, `gradio` runs
      # acestep.acestep_v15_pipeline with the REST routes bolted on.
      #
      # We used the Gradio one for months because the upstream README says the
      # API server is on 8001, and on this host 8001 is SillyTavern, which
      # answers convincingly enough that we concluded the README was wrong. It
      # was not. Hence the non-default port below.
      #
      # What the real API server adds: a job queue with workers, POST
      # /v1/reinitialize and /v1/init to swap models without restarting the
      # container, /v1/models and /v1/model_inventory to ask what is loaded,
      # CONFIG_PATH2/3 to hold several DiTs at once and pick per request, and
      # an OpenAPI schema at /docs.
      #
      # There is no Web UI in this mode, which is the point.
      ACESTEP_MODE: api

      # 8020 because 7860 is the Gradio UI and 8001 is SillyTavern. Any port
      # chosen here must be free on the host, and must match slopbc.toml's
      # [acestep] base_url.
      ACESTEP_API_HOST: 0.0.0.0
      ACESTEP_API_PORT: "8020"

      # Personal LAN API authentication. In api mode this is read straight from
      # the environment by acestep/api/server_cli.py; it needs no CLI flag.
      ACESTEP_API_KEY: qwe123

      # Deliberately empty. The entrypoint passes ACESTEP_EXTRA_ARGS to both
      # modes, and `--enable-api` is a Gradio-only flag: api_server's argparse
      # rejects unknown flags and the container dies at startup.
      ACESTEP_EXTRA_ARGS: ""
      ACESTEP_DOWNLOAD_SOURCE: ${ACESTEP_DOWNLOAD_SOURCE:-auto}
      # ---- Models ----
      #
      # Edit these to swap, then restart. Restarting is the right way to swap in
      # any case: POST /v1/init does NOT free the previous weights, so after a
      # few swaps VRAM is exhausted and even a 4-minute render fails its
      # pre-flight check.
      #
      # CURRENT: xl-sft + the 4B planner, to test whether DCW below is what has
      # been wrecking sft. Two 4B models only fit because offload is on.
      #
      # The known-good fallback, if the DCW test does not clear sft:
      #   ACESTEP_CONFIG_PATH: acestep-v15-xl-turbo
      #   ACESTEP_LM_MODEL_PATH: acestep-5Hz-lm-1.7B
      #
      # xl-sft produces noise on this box at 4, 6, 8, 10, 20, 50 and 150 steps,
      # at guidance 1 through 9, at shift 1 and 3, with the LM planner and
      # without, on both entry points, and under a request proven byte-identical
      # on repeat. Turbo was clean in every one of the same tests. The one thing
      # never varied across all of that is DCW, which is why it is off below.
      #
      # Turbo is also less to get wrong: DMD-GAN distilled, hard-clamped at 8
      # steps, and the handler rewrites guidance_scale to 1.0 regardless, so two
      # of the knobs that consumed an evening cannot be set incorrectly.
      # ACESTEP_CONFIG_PATH: acestep-v15-xl-sft
      # ACESTEP_INIT_LLM: "true"
      # ACESTEP_LM_MODEL_PATH: acestep-5Hz-lm-4B

      ACESTEP_CONFIG_PATH: acestep-v15-xl-turbo
      ACESTEP_INIT_LLM: "true"
      ACESTEP_LM_MODEL_PATH: acestep-5Hz-lm-1.7B

      # ---- Offloading ----
      #
      # Required, and NOT the default on this box. startup_model_init.py only
      # auto-enables offload when the card has less than
      # VRAM_AUTO_OFFLOAD_THRESHOLD_GB = 20.0; a 3090 reports 23.6 GB, so the
      # server assumes there is room and keeps everything resident. That is
      # fine for one model and wrong for two: a 4B DiT plus a 4B LM leaves
      # ~1.9 GB, and a 4-minute render needs ~4.5 GB, so it fails its VRAM
      # pre-flight. Setting this explicitly overrides the auto decision.
      #
      # Cost is about 1s per generation in CPU<->GPU transfers
      # (offload_time_cost in the logs), against 30-40s for a 4-minute render.
      #
      # ACESTEP_OFFLOAD_DIT_TO_CPU is deliberately left off: the DiT is ~9 GB
      # and moving it every stage would be far more expensive than the VAE and
      # text encoder.
      ACESTEP_OFFLOAD_TO_CPU: "true"
      ACESTEP_LM_OFFLOAD_TO_CPU: "true"

      # ---- DCW correction ----
      #
      # Reads a LOCAL PATCH to acestep/inference.py — upstream hardcodes this
      # on and exposes no way to disable it, not even in the REST API.
      #
      # DCW rewrites the latent once per sampler step. xl-sft on this box gets
      # *worse* as inference_steps rises — best at 4, chaotic by 10 — which is
      # backwards for a flow model and looks like a per-step perturbation
      # accumulating. Guidance was eliminated as the cause by a run at
      # guidance_scale=1.0, where the CFG branch is never entered at all and
      # the divergence persisted. DCW is the only other per-step term.
      #
      # Set to "false" to test that. "true" keeps upstream behaviour.
      # ACESTEP_DCW_ENABLED: "false"
      ACESTEP_DCW_ENABLED: "true"

      # ---- LM backend ----
      #
      # pt (PyTorch/transformers), NOT vllm. This is what makes GPU 0 shareable
      # with the Stable Audio 3 and stem-separation services.
      #
      # vllm loads the planner once and holds VRAM persistently (greedy KV-cache
      # reservation by design), so with the DiT resident it owns the rest of the
      # card and leaves nothing for a co-tenant. The pt backend instead honours
      # ACESTEP_LM_OFFLOAD_TO_CPU below: the LM lives in CPU RAM and is moved onto
      # the GPU only during the planning step, then offloaded back (see the
      # load/offload context manager in acestep/llm_inference.py, which logs
      # "Offloaded LLM to CPU in …s"). nano-vllm/mlx do NOT offload.
      #
      # Same acestep-5Hz-lm weights, so planning QUALITY is unchanged; the cost
      # is per-song LM latency (no paged attention + an ~8 GB CPU<->GPU shuffle).
      # Acceptable for one short plan per track. Valid values: vllm, pt, mlx
      # (VALID_LM_BACKENDS in acestep/gpu_config.py).
      ACESTEP_LM_BACKEND: pt
      ACESTEP_DEVICE: ${ACESTEP_DEVICE:-auto}
      ACESTEP_NO_INIT: ${ACESTEP_NO_INIT:-false}
      ACESTEP_QUEUE_MAXSIZE: ${ACESTEP_QUEUE_MAXSIZE:-20}
      ACESTEP_QUEUE_WORKERS: "1"
      ACESTEP_API_WORKERS: "1"
      ACESTEP_TMPDIR: /app/.cache/acestep/tmp
      TRITON_CACHE_DIR: /app/.cache/acestep/triton
      TORCHINDUCTOR_CACHE_DIR: /app/.cache/acestep/torchinductor
      HF_HOME: /root/.cache/huggingface
      TOKENIZERS_PARALLELISM: "false"

    # ---- Ports ----
    #
    # 8020 was probed free on ai.lemon.com. 8001 is SillyTavern and 7860 was the
    # Gradio UI, so neither is available for this. Must match ACESTEP_API_PORT
    # above and slopbc.toml's [acestep] base_url.
    ports:
      - "0.0.0.0:8020:8020"

    # ---- Persistent volumes ----
    volumes:
      - type: bind
        source: ${ACESTEP_DATA_ROOT:-/srv/acestep}/checkpoints
        target: /app/checkpoints
      - type: bind
        source: ${ACESTEP_DATA_ROOT:-/srv/acestep}/cache
        target: /app/.cache/acestep
      - type: bind
        source: ${ACESTEP_DATA_ROOT:-/srv/acestep}/huggingface
        target: /root/.cache/huggingface
      - type: bind
        source: ${ACESTEP_DATA_ROOT:-/srv/acestep}/outputs
        target: /app/output
      - type: bind
        source: ${ACESTEP_DATA_ROOT:-/srv/acestep}/gradio_outputs
        target: /app/gradio_outputs
      - type: bind
        source: ${ACESTEP_DATA_ROOT:-/srv/acestep}/training
        target: /app/lokr_output

    # ---- Shared memory for PyTorch DataLoader ----
    shm_size: "2gb"

    restart: unless-stopped

    # /health is the only endpoint that answers without a token.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8020/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 10m
      retries: 5
